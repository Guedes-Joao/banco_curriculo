<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login da Empresa</title>
</head>
<body>
  <h2>Login da Empresa</h2>
  <form id="formLoginEmpresa">
    <label for="cnpj">CNPJ:</label><br>
    <input type="text" id="cnpj" name="cnpj" required><br><br>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" required><br><br>

    <button type="submit">Entrar</button>
  </form>

  <p>Ainda não tem conta? <a href="cadastro_empresa.html">Criar Conta</a></p>

  <script src="../js/verificacao.js"></script>
</body>
</html>
