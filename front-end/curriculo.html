<h2>Cadastro de Currículo - Aluno</h2>

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>
<div class="progress-text" id="progressText">0%</div>

<form id="form">
    <label>Nome Completo:</label>
    <input type="text" name="nome" required>

    <label>Idade:</label>
    <input type="text" id="idade" name="idade" required oninput="validarIdade()">

    <label>Telefone:</label>
    <input type="tel" name="telefone" required>

    <label>E-mail:</label>
    <input type="email" name="email" required>

    <label>Curso na ETEC:</label>
    <select name="curso" required>
        <option value="">Selecione</option>
        <option>Administração</option>
        <option>Informática</option>
        <option>Desenvolvimento de Sistemas</option>
        <option>Agropecuária</option>
    </select>

    <label>Período:</label>
    <select name="periodo" required>
        <option value="">Selecione</option>
        <option>1º módulo</option>
        <option>2º módulo</option>
        <option>3º módulo</option>
    </select>

    <label>Ano de Ingresso:</label>
    <input type="number" name="ano_ingresso">

    <label>Turno:</label>
    <select name="turno">
        <option value="">Selecione</option>
        <option>Manhã</option>
        <option>Tarde</option>
        <option>Noite</option>
    </select>

    <label>Objetivo Profissional:</label>
    <textarea name="objetivo" rows="3"></textarea>

    <label>Habilidades e Competências:</label>
    <textarea name="habilidades" rows="3"></textarea>

    <label>Experiências Profissionais:</label>
    <textarea name="experiencia" rows="4"></textarea>

    <label>Cursos Complementares:</label>
    <textarea name="cursos" rows="3"></textarea>

    <label>Upload do Currículo (opcional):</label>
    <input type="file" name="curriculo" accept=".pdf">

    <button type="submit">Enviar para Análise</button>
</form>
</div>
